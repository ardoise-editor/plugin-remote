[package]
name = "ardoise-remote"
version = "1.1.2"
edition = "2021"
rust-version = "1.90"
publish = false
description = "The Remote Files plugin of Ardoise"
license = "MIT"

[[bin]]
name = "remote"
path = "src/main.rs"

[dependencies]
ardoise-plugin = { git = "https://github.com/ardoise-editor/plugin-sdk", tag = "v0.14.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "process", "io-util", "time", "macros"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
